services:
  - type: web
    name: livekit-joint-cursor-task4
    env: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: |
      npm ci
      npm run build --workspace=@cursor/web
      npm run build --workspace=@cursor/server
    startCommand: node packages/server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      # 以下はRenderのダッシュボードで実値を設定してください（Secretにすること）
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_WS_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: PROLIFIC_API_TOKEN
        sync: false
      - key: PROLIFIC_API_BASE_URL
        value: https://api.prolific.com/api/v1
      - key: TOKEN_TTL_SECONDS
        value: 600
