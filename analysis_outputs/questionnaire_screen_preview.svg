<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-label="Participant questionnaire screen preview">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 14px; fill: #475569; }
      .legend { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .option { font-size: 14px; fill: #334155; }
      .option-selected { font-size: 14px; font-weight: 700; fill: #134e4a; }
      .button { font-size: 15px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="900" height="720" fill="#edf2f7"/>
  <text class="ui small" x="450" y="46" text-anchor="middle">Participant screen during shared-cursor questionnaire</text>

  <g transform="translate(180 82)">
    <rect x="0" y="0" width="540" height="540" rx="16" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="0" y="0" width="540" height="540" rx="16" fill="#f8fafc" opacity="0.94"/>

    <g transform="translate(40 76)">
      <rect x="0" y="0" width="460" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="20" y="-10" width="342" height="24" fill="#ffffff"/>
      <text class="ui legend" x="24" y="7">How much control did you feel you had over the cursor</text>
      <text class="ui legend" x="24" y="30">
        <tspan font-style="italic" font-weight="800">yourself</tspan><tspan>?</tspan>
      </text>

      <g transform="translate(20 55)">
        <rect x="0" y="0" width="198" height="40" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
        <circle cx="18" cy="20" r="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text class="ui option" x="34" y="25">0: Not at all</text>

        <rect x="218" y="0" width="198" height="40" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
        <circle cx="236" cy="20" r="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text class="ui option" x="252" y="25">1: Not much</text>

        <rect x="0" y="50" width="198" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
        <circle cx="18" cy="70" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
        <circle cx="18" cy="70" r="3.5" fill="#0f766e"/>
        <text class="ui option-selected" x="34" y="75">2: A little</text>

        <rect x="218" y="50" width="198" height="40" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
        <circle cx="236" cy="70" r="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text class="ui option" x="252" y="75">3: Very much</text>
      </g>
    </g>

    <g transform="translate(40 226)">
      <rect x="0" y="0" width="460" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="20" y="-10" width="404" height="24" fill="#ffffff"/>
      <text class="ui legend" x="24" y="7">How much control did you feel you had over the cursor</text>
      <text class="ui legend" x="24" y="30">
        <tspan font-style="italic" font-weight="800">together with your partner</tspan><tspan>?</tspan>
      </text>

      <g transform="translate(20 55)">
        <rect x="0" y="0" width="198" height="40" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
        <circle cx="18" cy="20" r="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text class="ui option" x="34" y="25">0: Not at all</text>

        <rect x="218" y="0" width="198" height="40" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
        <circle cx="236" cy="20" r="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text class="ui option" x="252" y="25">1: Not much</text>

        <rect x="0" y="50" width="198" height="40" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
        <circle cx="18" cy="70" r="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text class="ui option" x="34" y="75">2: A little</text>

        <rect x="218" y="50" width="198" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
        <circle cx="236" cy="70" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
        <circle cx="236" cy="70" r="3.5" fill="#0f766e"/>
        <text class="ui option-selected" x="252" y="75">3: Very much</text>
      </g>
    </g>

    <g transform="translate(380 383)">
      <rect x="0" y="0" width="120" height="42" rx="6" fill="#0f766e"/>
      <text class="ui button" x="60" y="27" text-anchor="middle">Next</text>
    </g>
  </g>

  <text class="ui small" x="450" y="660" text-anchor="middle">The Next button appears only after both questions have been answered.</text>
</svg>
